<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culturama</title>
</head>
<body>
    <header>

        <h1>Dados da Pesquisa </h1>
        <section>

            <fieldset>

                <form action="" method="get">
                    <!--Para Nome-->
                    <label for="userName">Nome</label>
                    <input type="text" name="userName" required>
                    <br> 
                    <!--Para idadade-->           
                    <label for="userAge">Idade</label>
                    <input type="number" name="userAge" required min="12" max="100">
                    <br>
                    <!--PaRa Data de Nascimento-->
                    <label for="userBirthDate">Data de Nascimento</label>
                    <input type="date" name="userBirthDate" required min="12" max="100">
                    <br>
                    <!--PaRa e-mail-->
                    <label for="userEmail">E-mail</label>
                    <input type="email" name="userEmail" required>
                    <br>
                    <!--Para telefo-->
                    <label for="userPhoneNumber">E-mail</label>
                    <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="(xxx) xxxx-xxxx">
                    <br>
                    <!--Para foto do Usuario -->
                    <label for="userImage">Upload de foto</label>
                    <input type="file" accept="image/*" name="userImage">
                    <br>
                    
            </fieldset>
            
 
            <button type="submit">Enviar</button>

            </form>


        </section>


    </header>
    
</body>
</html>
